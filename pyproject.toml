[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-manager-agent"
version = "0.1.0"
description = "Phase 1: local LangGraph graph that classifies Hebrew WhatsApp messages as tasks and extracts task fields using Gemini structured output."
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "pydantic>=2",
    "google-genai",
    "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["src/task_manager_agent"]
